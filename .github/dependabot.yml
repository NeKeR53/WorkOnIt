version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
