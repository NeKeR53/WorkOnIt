[package]
name = "workonit"
version = "0.1.0"
description = "Local automation kanban"
authors = ["WorkOnIt contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NeKeR53/WorkOnIt"
homepage = "https://github.com/NeKeR53/WorkOnIt"
readme = "../README.md"
keywords = ["automation", "desktop", "kanban", "local-first", "tauri"]
categories = ["gui"]
publish = false

[lib]
name = "workonit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workonit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
dirs = "6"
encoding_rs = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
